name: Native cross-OS qualification
on:
  pull_request:
    paths: ["CMakeLists.txt", "VERSION", "native/**", ".github/workflows/native-*.yml", ".github/scripts/**", ".github/tools/**", "apps/website/src/content/native/cross-compilation.tiramisu"]
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: native-cross-os-${{ github.ref }}
  cancel-in-progress: false
jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      linux: ${{ steps.packages.outputs.linux }}
      windows: ${{ steps.packages.outputs.windows }}
    steps:
      - name: Locate same-revision native host packages and GNU SDK metadata
        id: packages
        uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        with:
          script: |
            const wanted = {
              linux: ['native-linux-assets', 'native-linux-arm64-assets', 'linux-cross-sdk-x86_64', 'linux-cross-sdk-arm64'],
              windows: ['native-windows-assets', 'native-windows-arm64-assets'],
            };
            for (let attempt = 0; attempt < 100; attempt++) {
              const found = {};
              for (const system of Object.keys(wanted)) {
                const runs = await github.rest.actions.listWorkflowRuns({
                  ...context.repo, workflow_id: 'native-' + system + '.yml',
                  head_sha: process.env.SOURCE_SHA, per_page: 20,
                });
                const run = runs.data.workflow_runs.find(run => run.head_sha === process.env.SOURCE_SHA &&
                  run.head_repository.full_name === context.repo.owner + '/' + context.repo.repo);
                if (!run) continue;
                const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
                  {...context.repo, run_id: run.id, per_page: 100});
                if (wanted[system].every(name => artifacts.some(a => a.name === name && !a.expired))) {
                  found[system] = run.id;
                } else if (run.status === 'completed') {
                  throw new Error(system + ' qualification ended without required packages');
                }
              }
              if (Object.keys(found).length === 2) {
                for (const [system, id] of Object.entries(found)) core.setOutput(system, String(id));
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 30000));
            }
            throw new Error('Timed out waiting for matching native packages');

  macos-package:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: "1"
      ZERO_AR_DATE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install native dependencies
        run: |
          brew update
          brew install cmake ninja tomlplusplus zstd z3
          brew upgrade zstd z3
      - run: python3 .github/scripts/provision_native_llvm.py --install --directory "$RUNNER_TEMP/pinned-llvm"
      - run: python3 .github/scripts/provision_cross_lld.py --llvm "$KALANDRA_LLVM_ROOT" --directory "$RUNNER_TEMP/cross-lld"
      - name: Build host compiler with private cross linkers
        run: |
          cmake -S . -B build/macos -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DKALANDRA_LLVM_ROOT="$KALANDRA_LLVM_ROOT" -DCMAKE_OSX_DEPLOYMENT_TARGET=26.0 \
            -Dtomlplusplus_DIR="$(brew --prefix tomlplusplus)/lib/cmake/tomlplusplus" \
            -DKALANDRA_BUILD_METAL_RUNTIME=OFF -DKALANDRA_BUILD_METAL_PROOF=OFF
          cmake --build build/macos --target native-cpu-standalone-package kalandra kalandra-cross-target-tests -j2
          ctest --test-dir build/macos --output-on-failure \
            -R '^native-(cross-target-codegen|cross-toolchain-validation|call-foundation-source)$'
      - name: Validate macOS 26 system imports and build own C++ safety objects
        run: >-
          python3 .github/scripts/macos_link_imports.py
          --package build/macos/native-cpu-standalone/package-stage/kalandra-native-cpu-standalone
          --clang "$KALANDRA_LLVM_ROOT/bin/clang++" --nm "$KALANDRA_LLVM_ROOT/bin/llvm-nm"
          --output macos-link-imports
      - uses: actions/upload-artifact@v4
        with:
          name: cross-native-macos-assets
          path: build/macos/native-cpu-standalone/*.tar.gz*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: macos-link-imports
          path: macos-link-imports/*
          if-no-files-found: error

  runtime-bundle:
    needs: [packages, macos-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v4
        with:
          pattern: native-linux*assets
          path: source-assets
          merge-multiple: true
          run-id: ${{ needs.packages.outputs.linux }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: native-windows*assets
          path: source-assets
          merge-multiple: true
          run-id: ${{ needs.packages.outputs.windows }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: cross-native-macos-assets
          path: source-assets
      - name: Assemble each host package twice from frozen runtime bytes
        run: |
          python3 native/packaging/RuntimeBundles.py --assets source-assets --output bundled-assets
          python3 native/packaging/RuntimeBundles.py --assets source-assets --output repeated-assets
          python3 .github/scripts/compare_cross_bundles.py bundled-assets repeated-assets
      - uses: actions/upload-artifact@v4
        with:
          name: cpu-target-runtimes
          path: bundled-assets/kalandra-cpu-target-runtimes.tar.gz*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: bundled-tools-linux-x86_64
          path: bundled-assets/kalandra-native-cpu-standalone-linux-x86_64.tar.gz*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: bundled-tools-linux-arm64
          path: bundled-assets/kalandra-native-cpu-standalone-linux-arm64.tar.gz*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: bundled-tools-windows-x86_64
          path: bundled-assets/kalandra-native-cpu-standalone-windows-x86_64.tar.gz*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: bundled-tools-windows-arm64
          path: bundled-assets/kalandra-native-cpu-standalone-windows-arm64.tar.gz*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: bundled-tools-macos-arm64
          path: bundled-assets/kalandra-native-cpu-standalone-macos-arm64.tar.gz*
          if-no-files-found: error

  windows-sdk-send:
    name: Encrypted Windows SDK ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64
            msvc: x64
          - runner: windows-11-arm
            target: arm64
            msvc: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc }}
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/kalandra-llvm/installation
          key: native-llvm-mlir-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/toolchain-proof/toolchain.json') }}-v2
      - run: python .github/scripts/provision_native_platform.py
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.3"
          cache: false
      - name: Build and verify authenticated CI transport
        shell: pwsh
        run: |
          go build -o sdk-transfer.exe .github/tools/sdk-transfer/main.go
          if ($LASTEXITCODE -ne 0) { throw 'Transport build failed' }
          python .github/tools/sdk-transfer/test_transport.py sdk-transfer.exe
          if ($LASTEXITCODE -ne 0) { throw 'Transport authentication failed' }
      - name: Encrypt SDK for linux-x86_64
        shell: pwsh
        run: python .github/scripts/windows_sdk_exchange.py send --tool sdk-transfer.exe --receiver linux-x86_64 --output sealed-sdk
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-sealed-${{ matrix.target }}-linux-x86_64
          path: sealed-sdk/linux-x86_64/sdk.sealed
          retention-days: 1
          if-no-files-found: error
      - name: Encrypt SDK for linux-arm64
        shell: pwsh
        run: python .github/scripts/windows_sdk_exchange.py send --tool sdk-transfer.exe --receiver linux-arm64 --output sealed-sdk
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-sealed-${{ matrix.target }}-linux-arm64
          path: sealed-sdk/linux-arm64/sdk.sealed
          retention-days: 1
          if-no-files-found: error
      - name: Encrypt SDK for windows-x86_64
        shell: pwsh
        run: python .github/scripts/windows_sdk_exchange.py send --tool sdk-transfer.exe --receiver windows-x86_64 --output sealed-sdk
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-sealed-${{ matrix.target }}-windows-x86_64
          path: sealed-sdk/windows-x86_64/sdk.sealed
          retention-days: 1
          if-no-files-found: error
      - name: Encrypt SDK for windows-arm64
        shell: pwsh
        run: python .github/scripts/windows_sdk_exchange.py send --tool sdk-transfer.exe --receiver windows-arm64 --output sealed-sdk
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-sealed-${{ matrix.target }}-windows-arm64
          path: sealed-sdk/windows-arm64/sdk.sealed
          retention-days: 1
          if-no-files-found: error
      - name: Encrypt SDK for macos-arm64
        shell: pwsh
        run: python .github/scripts/windows_sdk_exchange.py send --tool sdk-transfer.exe --receiver macos-arm64 --output sealed-sdk
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-sealed-${{ matrix.target }}-macos-arm64
          path: sealed-sdk/macos-arm64/sdk.sealed
          retention-days: 1
          if-no-files-found: error

  cross-build:
    name: CPU cross-build from ${{ matrix.system }}-${{ matrix.host }}
    needs: [packages, macos-package, runtime-bundle]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: linux
            host: x86_64
          - runner: ubuntu-24.04-arm
            system: linux
            host: arm64
          - runner: windows-2025
            system: windows
            host: x86_64
          - runner: windows-11-arm
            system: windows
            host: arm64
          - runner: macos-26
            system: macos
            host: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.3"
          cache: false
      - name: Create private receiver key
        shell: bash
        run: |
          suffix=""
          if [ "$RUNNER_OS" = Windows ]; then suffix=".exe"; fi
          go build -o "sdk-transfer$suffix" .github/tools/sdk-transfer/main.go
          python .github/tools/sdk-transfer/test_transport.py "./sdk-transfer$suffix"
          "./sdk-transfer$suffix" key "$RUNNER_TEMP/sdk-private.pem" "$RUNNER_TEMP/sdk-public.pem"
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-receiver-${{ matrix.system }}-${{ matrix.host }}
          path: ${{ runner.temp }}/sdk-public.pem
          retention-days: 1
          if-no-files-found: error
      - name: Decrypt only within this build job
        shell: bash
        run: |
          suffix=""
          if [ "$RUNNER_OS" = Windows ]; then suffix=".exe"; fi
          python .github/scripts/windows_sdk_exchange.py receive --tool "./sdk-transfer$suffix" \
            --key "$RUNNER_TEMP/sdk-private.pem" --receiver ${{ matrix.system }}-${{ matrix.host }} --output private-sdk
      - uses: actions/download-artifact@v4
        with:
          name: bundled-tools-${{ matrix.system }}-${{ matrix.host }}
          path: native-assets
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-cross-sdk-*
          path: linux-sdk
          run-id: ${{ needs.packages.outputs.linux }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: macos-link-imports
          path: macos-link-imports
      - name: Retarget one host download using public CLI flags
        run: >-
          python .github/scripts/qualify_bundled_cross.py --system ${{ matrix.system }}
          --host ${{ matrix.host }} --assets native-assets --sdk private-sdk
          --linux-sdk linux-sdk --imports macos-link-imports --output build/cross-products
      - uses: actions/upload-artifact@v4
        with:
          name: cross-products-${{ matrix.system }}-${{ matrix.host }}
          path: build/cross-products/*/products/*
          if-no-files-found: error
      - name: Remove private SDK inputs and key
        if: always()
        shell: bash
        run: python .github/scripts/cleanup_sdk_receiver.py

  execute:
    name: Native execution ${{ matrix.source }} to ${{ matrix.target }}
    if: always() && !cancelled()
    needs: cross-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: linux-x86_64
            target: linux-arm64
            runner: ubuntu-24.04-arm
          - source: linux-x86_64
            target: windows-x86_64
            runner: windows-2025
          - source: linux-x86_64
            target: windows-arm64
            runner: windows-11-arm
          - source: linux-x86_64
            target: macos-arm64
            runner: macos-26
          - source: linux-arm64
            target: linux-x86_64
            runner: ubuntu-24.04
          - source: linux-arm64
            target: windows-x86_64
            runner: windows-2025
          - source: linux-arm64
            target: windows-arm64
            runner: windows-11-arm
          - source: linux-arm64
            target: macos-arm64
            runner: macos-26
          - source: windows-x86_64
            target: linux-x86_64
            runner: ubuntu-24.04
          - source: windows-x86_64
            target: linux-arm64
            runner: ubuntu-24.04-arm
          - source: windows-x86_64
            target: windows-arm64
            runner: windows-11-arm
          - source: windows-x86_64
            target: macos-arm64
            runner: macos-26
          - source: windows-arm64
            target: linux-x86_64
            runner: ubuntu-24.04
          - source: windows-arm64
            target: linux-arm64
            runner: ubuntu-24.04-arm
          - source: windows-arm64
            target: windows-x86_64
            runner: windows-2025
          - source: windows-arm64
            target: macos-arm64
            runner: macos-26
          - source: macos-arm64
            target: linux-x86_64
            runner: ubuntu-24.04
          - source: macos-arm64
            target: linux-arm64
            runner: ubuntu-24.04-arm
          - source: macos-arm64
            target: windows-x86_64
            runner: windows-2025
          - source: macos-arm64
            target: windows-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v4
        with:
          name: cross-products-${{ matrix.source }}
          path: cross-products
      - name: Execute conformance on native destination hardware
        run: python native/tests/CrossCompilationTests.py execute --output cross-products/${{ matrix.target }}/products
