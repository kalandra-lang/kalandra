name: Native cross-OS qualification
on:
  pull_request:
    paths: ["CMakeLists.txt", "VERSION", "native/**", ".github/workflows/native-*.yml", ".github/scripts/**"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: native-cross-os-${{ github.ref }}
  cancel-in-progress: false
jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      linux: ${{ steps.packages.outputs.linux }}
      windows: ${{ steps.packages.outputs.windows }}
    steps:
      - name: Locate same-revision qualified native packages
        id: packages
        uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        with:
          script: |
            const wanted = {
              linux: ['native-linux-assets', 'native-linux-arm64-assets', 'linux-cross-sdk-x86_64', 'linux-cross-sdk-arm64'],
              windows: ['native-windows-assets', 'native-windows-arm64-assets'],
            };
            for (let attempt = 0; attempt < 70; attempt++) {
              const found = {};
              for (const system of Object.keys(wanted)) {
                const runs = await github.rest.actions.listWorkflowRuns({
                  ...context.repo, workflow_id: `native-${system}.yml`, head_sha: process.env.SOURCE_SHA,
                  per_page: 20,
                });
                const run = runs.data.workflow_runs.find(run => run.head_sha === process.env.SOURCE_SHA &&
                  run.head_repository.full_name === `${context.repo.owner}/${context.repo.repo}`);
                if (!run) continue;
                const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
                  {...context.repo, run_id: run.id, per_page: 100});
                if (wanted[system].every(name => artifacts.some(a => a.name === name && !a.expired))) {
                  found[system] = run.id;
                } else if (run.status === 'completed') {
                  throw new Error(`${system} qualification ${run.id} ended without the required verified packages`);
                }
              }
              if (Object.keys(found).length === 2) {
                for (const [system, id] of Object.entries(found)) core.setOutput(system, String(id));
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 30000));
            }
            throw new Error('Timed out waiting for same-revision Linux and Windows packages');
  windows-to-linux:
    needs: packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            host: x86_64
            target: x86_64
          - runner: windows-2025
            host: x86_64
            target: arm64
          - runner: windows-11-arm
            host: arm64
            target: x86_64
          - runner: windows-11-arm
            host: arm64
            target: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/kalandra-llvm/installation
          key: native-llvm-mlir-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/toolchain-proof/toolchain.json') }}-v2
      - run: python .github/scripts/provision_native_platform.py
      - uses: actions/download-artifact@v4
        with:
          pattern: native-windows*assets
          path: native-assets
          merge-multiple: true
          run-id: ${{ needs.packages.outputs.windows }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: native-linux*assets
          path: native-assets
          merge-multiple: true
          run-id: ${{ needs.packages.outputs.linux }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: linux-cross-sdk-${{ matrix.target }}
          path: linux-sdk
          run-id: ${{ needs.packages.outputs.linux }}
          github-token: ${{ github.token }}
      - name: Cross-link using verified upstream GNU libraries
        run: >-
          python native/tests/CrossCompilationTests.py build
          --system linux --target ${{ matrix.target }} --output "build/cross os"
          --host-archive native-assets/kalandra-native-cpu-standalone-windows-${{ matrix.host }}.tar.gz
          --target-archive native-assets/kalandra-native-cpu-standalone-linux-${{ matrix.target }}.tar.gz
          --linux-sdk linux-sdk --linker "$env:KALANDRA_LLVM_ROOT/bin/ld.lld.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: cross-windows-${{ matrix.host }}-to-linux-${{ matrix.target }}
          path: build/cross os/products/*
          if-no-files-found: error
  execute-linux:
    needs: windows-to-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            host: x86_64
            target: x86_64
          - runner: ubuntu-24.04-arm
            host: x86_64
            target: arm64
          - runner: ubuntu-24.04
            host: arm64
            target: x86_64
          - runner: ubuntu-24.04-arm
            host: arm64
            target: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v4
        with:
          name: cross-windows-${{ matrix.host }}-to-linux-${{ matrix.target }}
          path: cross-products
      - name: Execute cross-built programs on the native Linux destination
        run: python3 native/tests/CrossCompilationTests.py execute --output cross-products
