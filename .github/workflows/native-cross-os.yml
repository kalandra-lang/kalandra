name: Native cross-OS qualification
on:
  pull_request:
    paths: ["CMakeLists.txt", "VERSION", "native/**", ".github/workflows/native-*.yml", ".github/scripts/**", "apps/website/src/content/native/cross-compilation.tiramisu"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: native-cross-os-${{ github.ref }}
  cancel-in-progress: false
jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      linux: ${{ steps.packages.outputs.linux }}
      windows: ${{ steps.packages.outputs.windows }}
    steps:
      - name: Locate same-revision qualified native packages
        id: packages
        uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        with:
          script: |
            const wanted = {
              linux: ['native-linux-assets', 'native-linux-arm64-assets', 'linux-cross-sdk-x86_64', 'linux-cross-sdk-arm64'],
              windows: ['native-windows-assets', 'native-windows-arm64-assets'],
            };
            for (let attempt = 0; attempt < 100; attempt++) {
              const found = {};
              for (const system of Object.keys(wanted)) {
                const runs = await github.rest.actions.listWorkflowRuns({
                  ...context.repo, workflow_id: `native-${system}.yml`, head_sha: process.env.SOURCE_SHA,
                  per_page: 20,
                });
                const run = runs.data.workflow_runs.find(run => run.head_sha === process.env.SOURCE_SHA &&
                  run.head_repository.full_name === `${context.repo.owner}/${context.repo.repo}`);
                if (!run) continue;
                const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
                  {...context.repo, run_id: run.id, per_page: 100});
                if (wanted[system].every(name => artifacts.some(a => a.name === name && !a.expired))) {
                  found[system] = run.id;
                } else if (run.status === 'completed') {
                  throw new Error(`${system} qualification ${run.id} ended without the required verified packages`);
                }
              }
              if (Object.keys(found).length === 2) {
                for (const [system, id] of Object.entries(found)) core.setOutput(system, String(id));
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 30000));
            }
            throw new Error('Timed out waiting for same-revision Linux and Windows packages');
  windows-to-linux:
    needs: packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            host: x86_64
            target: x86_64
          - runner: windows-2025
            host: x86_64
            target: arm64
          - runner: windows-11-arm
            host: arm64
            target: x86_64
          - runner: windows-11-arm
            host: arm64
            target: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/kalandra-llvm/installation
          key: native-llvm-mlir-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/toolchain-proof/toolchain.json') }}-v2
      - run: python .github/scripts/provision_native_platform.py
      - uses: actions/download-artifact@v4
        with:
          pattern: native-windows*assets
          path: native-assets
          merge-multiple: true
          run-id: ${{ needs.packages.outputs.windows }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: native-linux*assets
          path: native-assets
          merge-multiple: true
          run-id: ${{ needs.packages.outputs.linux }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: linux-cross-sdk-${{ matrix.target }}
          path: linux-sdk
          run-id: ${{ needs.packages.outputs.linux }}
          github-token: ${{ github.token }}
      - name: Cross-link using verified upstream GNU libraries
        run: >-
          python native/tests/CrossCompilationTests.py build
          --system linux --target ${{ matrix.target }} --output "build/cross os"
          --host-archive native-assets/kalandra-native-cpu-standalone-windows-${{ matrix.host }}.tar.gz
          --target-archive native-assets/kalandra-native-cpu-standalone-linux-${{ matrix.target }}.tar.gz
          --linux-sdk linux-sdk --linker "$env:KALANDRA_LLVM_ROOT/bin/ld.lld.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: cross-windows-${{ matrix.host }}-to-linux-${{ matrix.target }}
          path: build/cross os/products/*
          if-no-files-found: error
  execute-linux:
    needs: windows-to-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            host: x86_64
            target: x86_64
          - runner: ubuntu-24.04-arm
            host: x86_64
            target: arm64
          - runner: ubuntu-24.04
            host: arm64
            target: x86_64
          - runner: ubuntu-24.04-arm
            host: arm64
            target: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v4
        with:
          name: cross-windows-${{ matrix.host }}-to-linux-${{ matrix.target }}
          path: cross-products
      - name: Execute cross-built programs on the native Linux destination
        run: python3 native/tests/CrossCompilationTests.py execute --output cross-products

  macos-to-linux:
    needs: packages
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: "1"
      ZERO_AR_DATE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install native dependencies
        run: |
          brew update
          brew install cmake ninja tomlplusplus zstd z3
          brew upgrade zstd z3
      - name: Install verified pinned LLVM
        run: python3 .github/scripts/provision_native_llvm.py --install --directory "$RUNNER_TEMP/pinned-llvm"
      - name: Build matching host cross linkers
        run: python3 .github/scripts/provision_cross_lld.py --llvm "$KALANDRA_LLVM_ROOT" --directory "$RUNNER_TEMP/cross-lld"
      - name: Build host standalone CPU compiler and target ABI checks
        run: |
          cmake -S . -B build/macos -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DKALANDRA_LLVM_ROOT="$KALANDRA_LLVM_ROOT" -DCMAKE_OSX_DEPLOYMENT_TARGET=26.0 \
            -Dtomlplusplus_DIR="$(brew --prefix tomlplusplus)/lib/cmake/tomlplusplus" \
            -DKALANDRA_BUILD_METAL_RUNTIME=OFF -DKALANDRA_BUILD_METAL_PROOF=OFF
          cmake --build build/macos --target native-cpu-standalone-package kalandra kalandra-cross-target-tests -j2
          ctest --test-dir build/macos --output-on-failure \
            -R '^native-(cross-target-codegen|cross-toolchain-validation|call-foundation-source)$'
      - name: Validate SDK-free macOS system import interfaces
        run: >-
          python3 .github/scripts/macos_link_imports.py
          --package build/macos/native-cpu-standalone/package-stage/kalandra-native-cpu-standalone
          --clang "$KALANDRA_LLVM_ROOT/bin/clang++" --nm "$KALANDRA_LLVM_ROOT/bin/llvm-nm"
          --output macos-link-imports
      - uses: actions/upload-artifact@v4
        with:
          name: cross-native-macos-assets
          path: build/macos/native-cpu-standalone/*.tar.gz*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: macos-link-imports
          path: macos-link-imports/*
          if-no-files-found: error
      - uses: actions/download-artifact@v4
        with:
          pattern: native-linux*assets
          path: native-assets
          merge-multiple: true
          run-id: ${{ needs.packages.outputs.linux }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-cross-sdk-*
          path: linux-sdk
          run-id: ${{ needs.packages.outputs.linux }}
          github-token: ${{ github.token }}
      - name: Cross-link both Linux architectures
        run: |
          for target in x86_64 arm64; do
            python3 native/tests/CrossCompilationTests.py build \
              --system linux --target "$target" --output "build/cross-macos/$target" \
              --host-archive build/macos/native-cpu-standalone/kalandra-native-cpu-standalone-macos-arm64.tar.gz \
              --target-archive "native-assets/kalandra-native-cpu-standalone-linux-$target.tar.gz" \
              --linux-sdk "linux-sdk/linux-cross-sdk-$target" --linker "$KALANDRA_CROSS_LLD_ROOT/ld.lld"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cross-macos-arm64-to-linux
          path: |
            build/cross-macos/x86_64/products/*
            build/cross-macos/arm64/products/*
          if-no-files-found: error
  execute-linux-from-macos:
    needs: macos-to-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64
          - runner: ubuntu-24.04-arm
            target: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v4
        with:
          name: cross-macos-arm64-to-linux
          path: cross-products
      - name: Execute macOS-built programs on native Linux
        run: python3 native/tests/CrossCompilationTests.py execute --output cross-products/${{ matrix.target }}/products

  to-macos:
    needs: [packages, macos-to-linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: linux
            host: x86_64
          - runner: ubuntu-24.04-arm
            system: linux
            host: arm64
          - runner: windows-2025
            system: windows
            host: x86_64
          - runner: windows-11-arm
            system: windows
            host: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/kalandra-llvm/installation
          key: native-llvm-mlir-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/toolchain-proof/toolchain.json') }}-v2
      - run: python .github/scripts/provision_native_platform.py
      - uses: actions/download-artifact@v4
        with:
          pattern: native-${{ matrix.system }}*assets
          path: native-assets
          merge-multiple: true
          run-id: ${{ needs.packages.outputs[matrix.system] }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: cross-native-macos-assets
          path: native-assets
      - uses: actions/download-artifact@v4
        with:
          name: macos-link-imports
          path: macos-link-imports
      - name: Cross-link Mach-O programs without an Apple SDK on this host
        run: >-
          python .github/scripts/qualify_to_macos.py
          --system ${{ matrix.system }} --host ${{ matrix.host }}
          --assets native-assets --imports macos-link-imports --output "build/cross macos"
      - uses: actions/upload-artifact@v4
        with:
          name: cross-${{ matrix.system }}-${{ matrix.host }}-to-macos
          path: build/cross macos/products/*
          if-no-files-found: error
  execute-macos:
    needs: to-macos
    strategy:
      fail-fast: false
      matrix:
        system: [linux, windows]
        host: [x86_64, arm64]
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v4
        with:
          name: cross-${{ matrix.system }}-${{ matrix.host }}-to-macos
          path: cross-products
      - name: Verify signatures and execute on macOS 26
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess
          root = Path('cross-products')
          report = json.loads((root / 'qualification.json').read_text())
          for record in report['records']:
              subprocess.run(['codesign', '--verify', '--strict', str(root / record['file'])], check=True)
          PY
          python3 native/tests/CrossCompilationTests.py execute --output cross-products

  windows-sdk-send:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64
            msvc: x64
          - runner: windows-11-arm
            target: arm64
            msvc: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc }}
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/kalandra-llvm/installation
          key: native-llvm-mlir-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/toolchain-proof/toolchain.json') }}-v2
      - run: python .github/scripts/provision_native_platform.py
      - name: Build and verify authenticated CI transport
        shell: pwsh
        run: |
          go build -o sdk-transfer.exe .github/tools/sdk-transfer/main.go
          if ($LASTEXITCODE -ne 0) { throw 'Transport build failed' }
          python .github/tools/sdk-transfer/test_transport.py sdk-transfer.exe
          if ($LASTEXITCODE -ne 0) { throw 'Transport authentication tests failed' }
      - name: Encrypt installed SDK link inputs for each receiver
        shell: pwsh
        run: python .github/scripts/windows_sdk_exchange.py send --tool sdk-transfer.exe --output sealed-sdk
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-sealed-${{ matrix.target }}-linux-x86_64
          path: sealed-sdk/linux-x86_64/sdk.sealed
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-sealed-${{ matrix.target }}-linux-arm64
          path: sealed-sdk/linux-arm64/sdk.sealed
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-sealed-${{ matrix.target }}-macos-arm64
          path: sealed-sdk/macos-arm64/sdk.sealed
          retention-days: 1
          if-no-files-found: error

  to-windows:
    needs: [packages, macos-to-linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: linux
            host: x86_64
          - runner: ubuntu-24.04-arm
            system: linux
            host: arm64
          - runner: macos-26
            system: macos
            host: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Create private one-job receiver key
        run: |
          go build -o sdk-transfer .github/tools/sdk-transfer/main.go
          python .github/tools/sdk-transfer/test_transport.py ./sdk-transfer
          ./sdk-transfer key "$RUNNER_TEMP/sdk-private.pem" "$RUNNER_TEMP/sdk-public.pem"
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-receiver-${{ matrix.system }}-${{ matrix.host }}
          path: ${{ runner.temp }}/sdk-public.pem
          retention-days: 1
          if-no-files-found: error
      - name: Decrypt SDK link inputs inside this receiver job
        run: >-
          python .github/scripts/windows_sdk_exchange.py receive
          --tool ./sdk-transfer --key "${{ runner.temp }}/sdk-private.pem"
          --receiver ${{ matrix.system }}-${{ matrix.host }} --output private-sdk
      - uses: actions/cache/restore@v4
        if: runner.os == 'Linux'
        with:
          path: ${{ runner.temp }}/kalandra-llvm/installation
          key: native-llvm-mlir-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/toolchain-proof/toolchain.json') }}-v2
      - name: Locate native Linux LLVM
        if: runner.os == 'Linux'
        run: python .github/scripts/provision_native_platform.py
      - name: Install macOS LLVM dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake ninja zstd z3
          brew upgrade zstd z3
          python .github/scripts/provision_native_llvm.py --install --directory "$RUNNER_TEMP/pinned-llvm"
      - name: Build pinned macOS cross linker
        if: runner.os == 'macOS'
        run: python .github/scripts/provision_cross_lld.py --llvm "$KALANDRA_LLVM_ROOT" --directory "$RUNNER_TEMP/cross-lld"
      - uses: actions/download-artifact@v4
        with:
          pattern: native-windows*assets
          path: native-assets
          merge-multiple: true
          run-id: ${{ needs.packages.outputs.windows }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: matrix.system == 'linux'
        with:
          pattern: native-linux*assets
          path: native-assets
          merge-multiple: true
          run-id: ${{ needs.packages.outputs.linux }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: matrix.system == 'macos'
        with:
          name: cross-native-macos-assets
          path: native-assets
      - name: Cross-link both Windows destinations
        run: >-
          python .github/scripts/qualify_to_windows.py
          --system ${{ matrix.system }} --host ${{ matrix.host }}
          --assets native-assets --sdk private-sdk --output build/cross-windows
      - uses: actions/upload-artifact@v4
        with:
          name: cross-${{ matrix.system }}-${{ matrix.host }}-to-windows
          path: |
            build/cross-windows/x86_64/products/*
            build/cross-windows/arm64/products/*
          if-no-files-found: error
      - name: Remove private SDK inputs and receiver key
        if: always()
        run: |
          python - <<'PY'
          import os, shutil
          from pathlib import Path
          folder = Path('private-sdk')
          if folder.exists(): shutil.rmtree(folder)
          Path(os.environ['RUNNER_TEMP'], 'sdk-private.pem').unlink(missing_ok=True)
          PY

  execute-windows:
    needs: to-windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            system: linux
            host: x86_64
            target: x86_64
          - runner: windows-11-arm
            system: linux
            host: x86_64
            target: arm64
          - runner: windows-2025
            system: linux
            host: arm64
            target: x86_64
          - runner: windows-11-arm
            system: linux
            host: arm64
            target: arm64
          - runner: windows-2025
            system: macos
            host: arm64
            target: x86_64
          - runner: windows-11-arm
            system: macos
            host: arm64
            target: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v4
        with:
          name: cross-${{ matrix.system }}-${{ matrix.host }}-to-windows
          path: cross-products
      - name: Execute on the native Windows destination
        run: python native/tests/CrossCompilationTests.py execute --output cross-products/${{ matrix.target }}/products
