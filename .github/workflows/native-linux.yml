name: Native Linux qualification
on:
  push:
    branches: ["native"]
    tags: ["v*"]
    paths:
      [
        "CMakeLists.txt",
        "VERSION",
        "native/**",
        ".github/workflows/native-linux.yml",
        ".github/scripts/provision_native_platform.py",
        "apps/website/**",
        "scripts/verify-docs.*",
        "scripts/website-highlighting.ts",
        "tests/fixtures/docs-examples.json",
        "package.json",
        "bun.lock",
      ]
  pull_request:
    paths:
      [
        "CMakeLists.txt",
        "VERSION",
        "native/**",
        ".github/workflows/native-linux.yml",
        ".github/scripts/**",
        "apps/website/src/content/native/cross-compilation.tiramisu",
      ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-linux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ (github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci')) && fromJSON('[{"runner":"ubuntu-24.04","arch":"x86_64","artifact":"native-linux-assets"}]') || fromJSON('[{"runner":"ubuntu-24.04","arch":"x86_64","artifact":"native-linux-assets"},{"runner":"ubuntu-24.04-arm","arch":"arm64","artifact":"native-linux-arm64-assets"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      ZERO_AR_DATE: "1"
      CCACHE_DIR: ${{ runner.temp }}/ccache
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@v4
      - name: Reserve disk space for the LLVM SDK
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
        run: |
          df -h "$RUNNER_TEMP"
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h "$RUNNER_TEMP"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Validate tagged toolchain version and release notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python .github/scripts/release_version.py
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kalandra-llvm/installation
          key: native-llvm-mlir-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/toolchain-proof/toolchain.json') }}-v2
      - name: Verify architecture and release gates
        run: |
          python3 -m unittest discover -s .github/scripts -p test_linux_arm64.py
          python3 -m unittest discover -s .github/scripts -p test_linux_cross_sdk.py
          python3 -m unittest discover -s .github/scripts -p test_collect_native_platforms.py
          python3 -m unittest discover -s .github/scripts -p test_native_release_assets.py
          python3 -m unittest discover -s .github/scripts -p test_collect_vulkan_release.py
      - name: Provision verified LLVM/MLIR
        run: python3 .github/scripts/provision_native_platform.py
      - name: Install system build prerequisites
        run: |
          sudo apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install -y cmake ninja-build ccache patchelf bubblewrap libx11-dev xvfb xauth xfonts-base
          sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Cache compiler objects
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci')
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-linux-${{ matrix.arch }}-${{ hashFiles('native/toolchain-proof/toolchain.json') }}-${{ github.sha }}
          restore-keys: |
            ccache-linux-${{ matrix.arch }}-${{ hashFiles('native/toolchain-proof/toolchain.json') }}-
      - name: Configure native CPU compiler
        run: |
          launcher=()
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}" != "true" ]; then
            launcher=(-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache)
          fi
          cmake -S . -B build/linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DCMAKE_INSTALL_LIBDIR=lib -DKALANDRA_LLVM_ROOT="$KALANDRA_LLVM_ROOT" \
            -DKALANDRA_BUILD_METAL_RUNTIME=OFF -DKALANDRA_BUILD_METAL_PROOF=OFF "${launcher[@]}"
      - name: Qualify filesystem ownership, watch cancellation and overflow
        run: |
          cmake --build build/linux --target kalandra-filesystem-tests-optimized -j4
          ctest --test-dir build/linux --output-on-failure -R '^native-filesystem-runtime-optimized$'
      - name: Build native CPU toolchain
        run: |
          cmake --build build/linux --target native-cpu-toolchain kalandra kalandra-type-capability-tests kalandra-native-subscription-tests -j4
          build/linux/native/kalandra-type-capability-tests
      - name: Link and run C and C++ callers
        run: ctest --test-dir build/linux --output-on-failure -j4 -R "^native-(subscription-lifecycle|c-exports|c-portable-buffer-imports|c-header-imports)$"
      - name: Verify native values through an installed package
        run: python3 native/tests/NativeValueImportTests.py --compiler build/linux/native/kalandra
      - name: Exercise X11 windows and native event delivery
        run: xvfb-run -a python3 native/tests/WindowInteropTests.py --compiler build/linux/native/kalandra
      - name: Run the public watchDir iterator
        run: python3 native/tests/FileSystemSourceTests.py --compiler build/linux/native/kalandra --variant optimized --case watch-directory --output build/linux/watch-source
      - name: Qualify cooperative workgroup source and safety proofs
        run: |
          cmake --build build/linux --target native-workgroup-qualification -j4
          ctest --test-dir build/linux --output-on-failure -j4 -R '^frontend-workgroup-'
      - name: Qualify application entries, console I/O and formatting
        env:
          KALANDRA_TEST_JOBS: "2"
        run: |
          cmake --build build/linux --target native-io-qualification -j4
          ctest --test-dir build/linux --output-on-failure -j4 -L '^feature-io$' -LE '^feature-gpu$'
      - name: Qualify explicit returns and primitive types
        run: >-
          ctest --test-dir build/linux --output-on-failure
          -R '^native-explicit-returns$'
      - name: Qualify iterator contracts and source execution
        env:
          KALANDRA_TEST_JOBS: "2"
        run: |
          cmake --build build/linux --target native-iterator-qualification -j4
          exclude=()
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}" != "true" ]; then
            exclude=(-E '^native-(generator-source|iterator-fusion-cancellation)-debug$')
          fi
          ctest --test-dir build/linux --output-on-failure -j4 "${exclude[@]}" \
            -R '^(frontend-iterator-(contracts|fusion)-|native-((iterators|generator)-source-|iterator-fusion-))'
      - name: Qualify checked recursive calls and signed remainder
        env:
          KALANDRA_TEST_JOBS: "2"
        run: |
          cmake --build build/linux --target kalandra-checked-inlining-tests kalandra-cross-target-tests -j4
          ctest --test-dir build/linux --output-on-failure -j4 \
            -R '^native-(checked-inlining(-source(-float32)?-(hardware|software))?|cross-target-codegen|call-foundation-source|windows-tail-codegen|recursive-scalars|signed-remainder|tail-calls(-software)?|fast-calls)$'
      - name: Verify ordinary direct ABI and resource cleanup
        env:
          KALANDRA_TEST_JOBS: "2"
        run: |
          cmake --build build/linux --target kalandra-ordinary-entry-tests kalandra-task-core-optimized -j4
          ctest --test-dir build/linux --output-on-failure -j4 \
            -R '^native-(ordinary-(entry|source|pair-source|arrays|reductions|buffer-types|buffer-faults|direct-faults|scalar-exact|integer-cases)|windows-ordinary-codegen)$'
      - name: Qualify loop checking and native copy budgets
        run: |
          cmake --build build/linux --target kalandra-local-rebinding-tests-debug -j4
          ctest --test-dir build/linux --output-on-failure -R '^native-local-rebinding-frontend-debug$'
      - name: Qualify loop exits, cancellation and bounded structured groups
        env:
          KALANDRA_TEST_JOBS: "2"
        run: >-
          ctest --test-dir build/linux --output-on-failure -j4
          -R '^native-(loop-control|collect-ownership)-(debug|optimized|sanitized|thread-sanitized)$'
      - name: Qualify CPU tensor transforms
        run: >-
          python3 native/tests/TensorTransformTests.py
          --compiler build/linux/native/kalandra-test-observer --clang "$KALANDRA_LLVM_ROOT/bin/clang++"
          --output build/linux/tensor-transforms --quick
      - name: Qualify arithmetic policy, benchmark references and MIT provenance
        run: >-
          ctest --test-dir build/linux --output-on-failure -j4
          -R '^native-(cross-toolchain-validation|arithmetic-policy|ordering-(float|sort)-references|fair-benchmark-evidence|steel-vendor-license)$'
      - name: Qualify opaque synchronous task ownership
        run: |
          cmake --build build/linux --target kalandra-closed-task-tests-optimized -j4
          ctest --test-dir build/linux --output-on-failure -R '^native-closed-tasks-optimized$'
      - name: Qualify scoped ownership and compiler value layouts
        run: |
          cmake --build build/linux --target kalandra-ownership-scope-optimized kalandra-value-scope-optimized -j4
          ctest --test-dir build/linux --output-on-failure -j4 \
            -R '^native-(ownership-scope-optimized|value-scope-optimized|value-scope-layout-optimized)$'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Verify runnable native documentation
        run: bun run verify:docs -- --tools build/linux/native --report docs-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: native-docs-verification-linux-${{ matrix.arch }}
          path: docs-verification.json
          if-no-files-found: error
      - name: Package standalone compiler
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
        run: cmake --build build/linux --target native-cpu-standalone-package -j4
      - name: Independently rebuild and compare the distribution
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
        run: |
          cmake -S . -B build/linux-repro -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DCMAKE_INSTALL_LIBDIR=lib -DKALANDRA_LLVM_ROOT="$KALANDRA_LLVM_ROOT" \
            -DKALANDRA_BUILD_METAL_RUNTIME=OFF -DKALANDRA_BUILD_METAL_PROOF=OFF
          cmake --build build/linux-repro --target native-cpu-standalone-package -j4
          python3 native/packaging/CompareDistributions.py build/linux build/linux-repro --platform linux-${{ matrix.arch }} --kind cpu
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
        with:
          name: ${{ matrix.artifact }}
          path: build/linux/native-cpu-standalone/*.tar.gz*
          if-no-files-found: error
  cross-sdk:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reserve disk space for the LLVM SDK
        run: |
          df -h "$RUNNER_TEMP"
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h "$RUNNER_TEMP"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/kalandra-llvm/installation
          key: native-llvm-mlir-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/toolchain-proof/toolchain.json') }}-v2
      - name: Locate verified native Clang
        run: python3 .github/scripts/provision_native_platform.py
      - name: Lock upstream GNU SDK inputs and compile owned test objects
        run: |
          sudo apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install -y libc6-dev libgcc-13-dev libstdc++-13-dev
          python3 -m unittest discover -s .github/scripts -p test_linux_cross_sdk.py
          python3 .github/scripts/linux_cross_sdk.py lock --clang "$KALANDRA_LLVM_ROOT/bin/clang++" --output cross-sdk
      - uses: actions/upload-artifact@v4
        with:
          name: linux-cross-sdk-${{ matrix.arch }}
          path: cross-sdk/*
          if-no-files-found: error
  downloaded-package:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    needs: cpu
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            artifact: native-linux-assets
          - runner: ubuntu-24.04-arm
            arch: arm64
            artifact: native-linux-arm64-assets
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: downloaded
      - name: Install audit tools and enable process isolation
        run: |
          sudo apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install -y patchelf bubblewrap
          sudo sysctl -w vm.mmap_rnd_bits=28
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Qualify downloaded compiler without LLVM or the checkout
        run: python3 native/packaging/PortablePackageTests.py downloaded/kalandra-native-cpu-standalone-linux-${{ matrix.arch }}.tar.gz
  raspberry-pi-os:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    needs: cpu
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-arm64-assets
          path: downloaded
      - name: Permit isolated downloaded-package tests
        run: |
          sudo sysctl -w vm.mmap_rnd_bits=28
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Qualify official Raspberry Pi OS Trixie ARM64 userspace
        run: python3 .github/scripts/qualify_raspberry_pi_os.py
