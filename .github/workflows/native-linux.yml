name: Native Linux qualification
on:
  push:
    branches: ["native"]
    tags: ["v*"]
    paths:
      [
        "CMakeLists.txt",
        "VERSION",
        "native/**",
        ".github/workflows/native-linux.yml",
        ".github/scripts/provision_native_platform.py",
        "apps/website/**",
        "scripts/verify-docs.*",
        "scripts/website-highlighting.ts",
        "tests/fixtures/docs-examples.json",
        "package.json",
        "bun.lock",
      ]
  pull_request:
    paths: ["CMakeLists.txt", "VERSION", "native/**", ".github/workflows/native-linux.yml", ".github/scripts/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-linux-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            artifact: native-linux-assets
          - runner: ubuntu-24.04-arm
            arch: arm64
            artifact: native-linux-arm64-assets
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      ZERO_AR_DATE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Validate tagged toolchain version and release notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python .github/scripts/release_version.py
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kalandra-llvm/installation
          key: native-llvm-mlir-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/toolchain-proof/toolchain.json') }}-v2
      - name: Verify architecture and release gates
        run: |
          python3 -m unittest discover -s .github/scripts -p test_linux_arm64.py
          python3 -m unittest discover -s .github/scripts -p test_linux_cross_sdk.py
          python3 -m unittest discover -s .github/scripts -p test_collect_native_platforms.py
          python3 -m unittest discover -s .github/scripts -p test_native_release_assets.py
      - name: Provision verified LLVM/MLIR
        run: python3 .github/scripts/provision_native_platform.py
      - name: Install system build prerequisites
        run: |
          sudo apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install -y cmake ninja-build libtomlplusplus-dev patchelf bubblewrap
          sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Configure native CPU compiler
        run: >-
          cmake -S . -B build/linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          -DCMAKE_INSTALL_LIBDIR=lib -DKALANDRA_LLVM_ROOT="$KALANDRA_LLVM_ROOT"
          -DKALANDRA_BUILD_METAL_RUNTIME=OFF -DKALANDRA_BUILD_METAL_PROOF=OFF
      - name: Build native CPU toolchain
        run: cmake --build build/linux --target native-cpu-toolchain kalandra -j2
      - name: Qualify checked recursive calls and signed remainder
        run: |
          cmake --build build/linux --target kalandra-checked-inlining-tests kalandra-cross-target-tests -j2
          ctest --test-dir build/linux --output-on-failure -j2 \
            -R '^native-(checked-inlining(-source(-float32)?-(hardware|software))?|cross-target-codegen|call-foundation-source|windows-tail-codegen|recursive-scalars|signed-remainder|tail-calls(-software)?|fast-calls)$'
      - name: Verify ordinary direct ABI and resource cleanup
        run: |
          cmake --build build/linux --target kalandra-ordinary-entry-tests kalandra-task-core-optimized -j2
          ctest --test-dir build/linux --output-on-failure -j2 \
            -R '^native-(ordinary-(entry|source|pair-source|arrays|reductions|buffer-types|buffer-faults|direct-faults|scalar-exact|integer-cases)|windows-ordinary-codegen)$'
      - name: Qualify CPU tensor transforms
        run: >-
          python3 native/tests/TensorTransformTests.py
          --compiler build/linux/native/kalandra --clang "$KALANDRA_LLVM_ROOT/bin/clang++"
          --output build/linux/tensor-transforms --quick
      - name: Qualify arithmetic policy, benchmark references and MIT provenance
        run: >-
          ctest --test-dir build/linux --output-on-failure
          -R '^native-(cross-toolchain-validation|arithmetic-policy|fair-benchmark-evidence|steel-vendor-license)$'
      - name: Qualify opaque synchronous task ownership
        run: |
          cmake --build build/linux --target kalandra-closed-task-tests-optimized -j2
          ctest --test-dir build/linux --output-on-failure -R '^native-closed-tasks-optimized$'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Verify runnable native documentation
        run: bun run verify:docs -- --tools build/linux/native --report docs-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: native-docs-verification-linux-${{ matrix.arch }}
          path: docs-verification.json
          if-no-files-found: error
      - name: Package standalone compiler
        run: cmake --build build/linux --target native-cpu-standalone-package
      - name: Independently rebuild and compare the distribution
        run: |
          cmake -S . -B build/linux-repro -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DCMAKE_INSTALL_LIBDIR=lib -DKALANDRA_LLVM_ROOT="$KALANDRA_LLVM_ROOT" \
            -DKALANDRA_BUILD_METAL_RUNTIME=OFF -DKALANDRA_BUILD_METAL_PROOF=OFF
          cmake --build build/linux-repro --target native-cpu-standalone-package -j2
          python3 native/packaging/CompareDistributions.py build/linux build/linux-repro --platform linux-${{ matrix.arch }} --kind cpu
      - name: Lock upstream GNU SDK inputs for cross-OS qualification
        run: |
          sudo apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install -y libc6-dev libgcc-13-dev libstdc++-13-dev
          python3 .github/scripts/linux_cross_sdk.py lock --clang "$KALANDRA_LLVM_ROOT/bin/clang++" --output cross-sdk
      - uses: actions/upload-artifact@v4
        with:
          name: linux-cross-sdk-${{ matrix.arch }}
          path: cross-sdk/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/linux/native-cpu-standalone/*.tar.gz*
          if-no-files-found: error
  downloaded-package:
    needs: cpu
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            artifact: native-linux-assets
          - runner: ubuntu-24.04-arm
            arch: arm64
            artifact: native-linux-arm64-assets
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: downloaded
      - name: Install audit tools and enable process isolation
        run: |
          sudo apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install -y patchelf bubblewrap
          sudo sysctl -w vm.mmap_rnd_bits=28
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Qualify downloaded compiler without LLVM or the checkout
        run: python3 native/packaging/PortablePackageTests.py downloaded/kalandra-native-cpu-standalone-linux-${{ matrix.arch }}.tar.gz
  raspberry-pi-os:
    needs: cpu
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-arm64-assets
          path: downloaded
      - name: Permit isolated downloaded-package tests
        run: |
          sudo sysctl -w vm.mmap_rnd_bits=28
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Qualify official Raspberry Pi OS Trixie ARM64 userspace
        run: python3 .github/scripts/qualify_raspberry_pi_os.py

  cross-build:
    needs: cpu
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            host: x86_64
            target: arm64
            gcc: aarch64-linux-gnu
          - runner: ubuntu-24.04-arm
            host: arm64
            target: x86_64
            gcc: x86-64-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/kalandra-llvm/installation
          key: native-llvm-mlir-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/toolchain-proof/toolchain.json') }}-v2
      - name: Locate verified host LLVM linker
        run: python3 .github/scripts/provision_native_platform.py
      - uses: actions/download-artifact@v4
        with:
          pattern: native-linux*assets
          path: native-assets
          merge-multiple: true
      - name: Install target system development libraries
        run: |
          sudo apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install -y g++-13-${{ matrix.gcc }}
      - name: Cross-link reproducible programs using downloaded packages
        run: >-
          python3 native/tests/CrossCompilationTests.py build
          --system linux --target ${{ matrix.target }} --output "build/cross linux"
          --host-archive native-assets/kalandra-native-cpu-standalone-linux-${{ matrix.host }}.tar.gz
          --target-archive native-assets/kalandra-native-cpu-standalone-linux-${{ matrix.target }}.tar.gz
          --linker "$KALANDRA_LLVM_ROOT/bin/ld.lld"
      - uses: actions/upload-artifact@v4
        with:
          name: cross-linux-${{ matrix.host }}-to-${{ matrix.target }}
          path: build/cross linux/products/*
          if-no-files-found: error
  cross-execute:
    needs: cross-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            host: x86_64
            target: arm64
          - runner: ubuntu-24.04
            host: arm64
            target: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v4
        with:
          name: cross-linux-${{ matrix.host }}-to-${{ matrix.target }}
          path: cross-products
      - name: Execute every cross-built program on the native destination
        run: python3 native/tests/CrossCompilationTests.py execute --output cross-products
