name: Native Windows GPU qualification
on:
  pull_request:
    paths: ['CMakeLists.txt', 'native/**', '.github/workflows/native-windows-gpu.yml', '.github/scripts/provision_native_platform.py']
  push:
    branches: [develop, native]
    paths: ['CMakeLists.txt', 'native/**', '.github/workflows/native-windows-gpu.yml', '.github/scripts/provision_native_platform.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  device-resources:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Verify portable resource admission guards
        run: python3 -m unittest discover -s native/gpu-runtime/qualification -p 'test_*.py'
      - name: Provision isolated device compiler inputs
        run: |
          python3 .github/scripts/provision_cuda_build.py
          sudo apt-get update
          sudo apt-get install -y ninja-build libvulkan-dev glslc spirv-tools
      - name: Build portable bytecode from the exact source revision
        run: >-
          cmake -S native/gpu-runtime/qualification/resources -B build/device-resources -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DKALANDRA_CUDA_HEADERS="$KALANDRA_CUDA_HEADERS"
          -DKALANDRA_CUDA_NVRTC="$KALANDRA_CUDA_NVRTC"
          -DKALANDRA_CUDA_CRT_HEADERS="$KALANDRA_CUDA_CRT_HEADERS"
          -DKALANDRA_CUDA_CCCL_HEADERS="$KALANDRA_CUDA_CCCL_HEADERS"
      - run: cmake --build build/device-resources --target portable-gpu-resources --parallel 2
      - run: python3 native/gpu-runtime/qualification/portable_resources.py --export build/device-resources --directory build/portable-bytecode
      - uses: actions/upload-artifact@v4
        with:
          name: same-source-device-bytecode
          path: build/portable-bytecode
          if-no-files-found: error
          retention-days: 7
  runtime:
    name: Windows GPU runtime admission (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x86_64
            msvc: x64
          - runner: windows-11-arm
            arch: arm64
            msvc: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc }}
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kalandra-llvm/installation
          key: native-llvm-mlir-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/toolchain-proof/toolchain.json') }}-v2
      - name: Provision pinned native host compiler
        run: python .github/scripts/provision_native_platform.py
      - name: Fetch verified public Driver API declarations
        run: |
          python native/vulkan/qualification/provision_headers.py --directory "$env:RUNNER_TEMP/windows-vulkan-headers"
          if ($LASTEXITCODE -ne 0) { throw 'Vulkan headers failed verification' }
          python native/cuda-source/qualification/provision_headers.py --output "$env:RUNNER_TEMP/windows-cuda-headers"
          if ($LASTEXITCODE -ne 0) { throw 'CUDA headers failed verification' }
      - name: Compile both runtimes and test secure native loader admission
        run: |
          python native/gpu-runtime/qualification/windows_runtime.py --backend vulkan --llvm-root "$env:KALANDRA_LLVM_ROOT" --headers "$env:KALANDRA_VULKAN_HEADERS_ROOT/include" --arch ${{ matrix.arch }} --output build/windows-gpu-${{ matrix.arch }}/vulkan
          if ($LASTEXITCODE -ne 0) { throw 'Windows Vulkan runtime qualification failed' }
          python native/gpu-runtime/qualification/windows_runtime.py --backend cuda --llvm-root "$env:KALANDRA_LLVM_ROOT" --headers "$env:RUNNER_TEMP/windows-cuda-headers" --arch ${{ matrix.arch }} --output build/windows-gpu-${{ matrix.arch }}/cuda
          if ($LASTEXITCODE -ne 0) { throw 'Windows CUDA runtime qualification failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: native-windows-gpu-runtime-${{ matrix.arch }}
          path: build/windows-gpu-${{ matrix.arch }}/**/qualification.json
          if-no-files-found: error
          retention-days: 7
      # Build/admission evidence only. No physical GPU or performance claim.

  compiler-package:
    name: Windows GPU compiler packages (${{ matrix.arch }})
    concurrency:
      group: windows-gpu-compiler-${{ github.ref }}-${{ matrix.arch }}
      cancel-in-progress: false
    needs: device-resources
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x86_64
            msvc: x64
          - runner: windows-11-arm
            arch: arm64
            msvc: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc }}
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kalandra-llvm/installation
          key: native-llvm-mlir-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/toolchain-proof/toolchain.json') }}-v2
      - run: python .github/scripts/provision_native_platform.py
      - uses: actions/download-artifact@v4
        with:
          name: same-source-device-bytecode
          path: build/portable-bytecode
      - name: Verify portable resources and provision native build declarations
        run: |
          python native/gpu-runtime/qualification/portable_resources.py --directory build/portable-bytecode
          if ($LASTEXITCODE -ne 0) { throw 'Device source provenance failed' }
          python native/vulkan/qualification/provision_headers.py --directory "$env:RUNNER_TEMP/compiler-vulkan-headers"
          if ($LASTEXITCODE -ne 0) { throw 'Vulkan headers failed' }
          python native/cuda-source/qualification/provision_headers.py --output "$env:RUNNER_TEMP/compiler-cuda-headers"
          if ($LASTEXITCODE -ne 0) { throw 'CUDA headers failed' }
      - uses: actions/cache/restore@v4
        id: validator-cache
        with:
          path: ${{ runner.temp }}/spirv-binary-cache
          key: native-spirv-tools-${{ runner.arch }}-${{ hashFiles('native/toolchain-proof/toolchain.json', 'native/gpu-runtime/qualification/provision_validator.py') }}
          restore-keys: native-spirv-tools-${{ runner.arch }}-
      - name: Build the pinned native Windows SPIR-V validator
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/spirv-binary-cache
        run: python native/gpu-runtime/qualification/provision_validator.py --directory "$env:RUNNER_TEMP/native-spirv-validator" --arch ${{ matrix.arch }}
      - uses: actions/cache/save@v4
        if: steps.validator-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/spirv-binary-cache
          key: ${{ steps.validator-cache.outputs.cache-primary-key }}
      - name: Configure both native source backends
        run: >-
          cmake -S . -B build/windows-gpu -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF -DCMAKE_INSTALL_LIBDIR=lib
          -DKALANDRA_LLVM_ROOT="$env:KALANDRA_LLVM_ROOT"
          -DKALANDRA_BUILD_CUDA_SOURCE=ON -DKALANDRA_BUILD_CUDA_RUNTIME=ON
          -DKALANDRA_BUILD_VULKAN_RUNTIME=ON
          -DKALANDRA_GPU_PREBUILT_RESOURCES="${{ github.workspace }}/build/portable-bytecode"
          -DKALANDRA_CUDA_HEADERS="$env:RUNNER_TEMP/compiler-cuda-headers"
          -DVulkan_INCLUDE_DIRS="$env:KALANDRA_VULKAN_HEADERS_ROOT/include"
          -DKALANDRA_SPIRV_VAL="$env:KALANDRA_SPIRV_VAL"
          -DKALANDRA_VULKAN_SPIRV_NOTICE="$env:KALANDRA_VULKAN_SPIRV_NOTICE"
          -DKALANDRA_BUILD_METAL_RUNTIME=OFF -DKALANDRA_BUILD_METAL_PROOF=OFF
      - name: Build both standalone compiler archives
        run: cmake --build build/windows-gpu --parallel 2 --target kalandra native-cuda-standalone-package native-vulkan-standalone-package
      - name: Qualify relocated Windows packages
        run: |
          foreach ($backend in @('cuda', 'vulkan')) {
            python native/gpu-runtime/qualification/windows_installed.py --backend $backend --archive "build/windows-gpu/native-$backend-standalone/kalandra-native-$backend-standalone-windows-${{ matrix.arch }}.tar.gz" --root "build/installed-$backend" --arch ${{ matrix.arch }}
            if ($LASTEXITCODE -ne 0) { throw "$backend installed package failed" }
          }
      - name: Preserve native validator diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-spirv-validator-logs-${{ matrix.arch }}
          path: ${{ runner.temp }}/native-spirv-validator/vcpkg/buildtrees/**/*.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Verify frozen archive reproducibility
        run: |
          foreach ($backend in @('cuda', 'vulkan')) {
            $archive = Get-Item "build/windows-gpu/native-$backend-standalone/*.tar.gz"
            $before = (Get-FileHash $archive.FullName -Algorithm SHA256).Hash
            cmake --build build/windows-gpu --parallel 2 --target "native-$backend-standalone-package"
            if ($LASTEXITCODE -ne 0) { throw "$backend repeat package failed" }
            if ((Get-FileHash $archive.FullName -Algorithm SHA256).Hash -ne $before) { throw "$backend archive is not reproducible" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: native-windows-gpu-packages-${{ matrix.arch }}
          path: |
            build/windows-gpu/native-cuda-standalone/*.tar.gz*
            build/windows-gpu/native-vulkan-standalone/*.tar.gz*
            build/installed-*/qualification.json
          if-no-files-found: error
          retention-days: 7

  bundled-package:
    name: Windows GPU bundled CPU targets (${{ matrix.arch }})
    if: github.event_name == 'pull_request'
    needs: compiler-package
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x86_64
            msvc: x64
          - runner: windows-11-arm
            arch: arm64
            msvc: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc }}
      - uses: actions/download-artifact@v4
        with:
          name: native-windows-gpu-packages-${{ matrix.arch }}
          path: gpu-assets
      - name: Locate same-revision CPU runtime data
        id: runtimes
        uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        with:
          script: |
            for (let attempt = 0; attempt < 100; attempt++) {
              const runs = await github.rest.actions.listWorkflowRuns({
                ...context.repo, workflow_id: 'native-cross-os.yml',
                head_sha: process.env.SOURCE_SHA, per_page: 20,
              });
              const run = runs.data.workflow_runs.find(run => run.head_sha === process.env.SOURCE_SHA &&
                run.head_repository.full_name === context.repo.owner + '/' + context.repo.repo);
              if (run) {
                const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
                  {...context.repo, run_id: run.id, per_page: 100});
                if (artifacts.some(a => a.name === 'cpu-target-runtimes' && !a.expired)) {
                  core.setOutput('run', String(run.id));
                  return;
                }
                if (run.status === 'completed') throw new Error('CPU qualification ended without runtime data');
              }
              await new Promise(resolve => setTimeout(resolve, 30000));
            }
            throw new Error('Timed out waiting for same-revision CPU runtime data');
      - uses: actions/download-artifact@v4
        with:
          name: cpu-target-runtimes
          path: runtime-assets
          run-id: ${{ steps.runtimes.outputs.run }}
          github-token: ${{ github.token }}
      - name: Attach same-revision CPU runtime data reproducibly
        run: |
          foreach ($backend in @('cuda', 'vulkan')) {
            $archive = Get-Item "gpu-assets/windows-gpu/native-$backend-standalone/*.tar.gz"
            python native/packaging/RuntimeBundles.py --host-package $archive.FullName --runtime-bundle runtime-assets/kalandra-cpu-target-runtimes.tar.gz --output bundled-assets
            if ($LASTEXITCODE -ne 0) { throw "$backend CPU runtime attachment failed" }
            python native/packaging/RuntimeBundles.py --host-package $archive.FullName --runtime-bundle runtime-assets/kalandra-cpu-target-runtimes.tar.gz --output repeated-assets
            if ($LASTEXITCODE -ne 0) { throw "$backend repeated attachment failed" }
            $first = (Get-FileHash "bundled-assets/$($archive.Name)" -Algorithm SHA256).Hash
            if ((Get-FileHash "repeated-assets/$($archive.Name)" -Algorithm SHA256).Hash -ne $first) { throw "$backend runtime attachment is not reproducible" }
          }
      - name: Qualify relocated Windows GPU compilers with five bundled CPU targets
        run: |
          foreach ($backend in @('cuda', 'vulkan')) {
            python native/gpu-runtime/qualification/windows_installed.py --backend $backend --bundled-targets --archive "bundled-assets/kalandra-native-$backend-standalone-windows-${{ matrix.arch }}.tar.gz" --root "build/combined-$backend" --arch ${{ matrix.arch }}
            if ($LASTEXITCODE -ne 0) { throw "$backend combined package qualification failed" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: native-windows-gpu-bundled-packages-${{ matrix.arch }}
          path: |
            bundled-assets/*.tar.gz*
            build/combined-*/qualification.json
          if-no-files-found: error
          retention-days: 7
