name: Native CUDA qualification
on:
  pull_request:
    paths:
      [
        "CMakeLists.txt",
        "VERSION",
        "native/CMakeLists.txt",
        "native/cuda/**",
        "native/cuda-source/**",
        "native/vulkan/**",
        "native/gpu-source/**",
        "native/gpu-runtime/**",
        "native/gpu-bundle/**",
        "native/metal-source/**",
        "native/include/**",
        "native/lib/**",
        "native/tools/**",
        "native/cmake/**",
        "native/packaging/**",
        "native/toolchain-proof/toolchain.json",
        ".github/scripts/provision_cuda_build.py",
        ".github/scripts/provision_native_platform.py",
        ".github/workflows/native-cuda.yml",
      ]
  push:
    branches: [native]
    tags: ["v*"]
    paths:
      [
        "CMakeLists.txt",
        "VERSION",
        "native/**",
        ".github/scripts/provision_cuda_build.py",
        ".github/workflows/native-cuda.yml",
      ]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: native-cuda-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  compiler-package:
    runs-on: ubuntu-24.04
    # Includes two standalone archive builds and qualification after relocation.
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Validate tagged version and release notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 .github/scripts/release_version.py
      - name: Reserve disk space for the LLVM SDK
        run: |
          df -h "$RUNNER_TEMP"
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h "$RUNNER_TEMP"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kalandra-llvm/installation
          key: native-llvm-mlir-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/toolchain-proof/toolchain.json') }}-v2
      - name: Check exact-tag release and asset gates
        run: |
          python3 -m unittest discover -s .github/scripts -p test_collect_vulkan_release.py
          python3 -m unittest discover -s .github/scripts -p test_collect_cuda_release.py
          python3 -m unittest discover -s .github/scripts -p test_native_release_assets.py
          python3 -m unittest discover -s .github/scripts -p test_editor_windows_processes.py
      - name: Provision production-pinned LLVM and isolated CUDA build inputs
        run: |
          python3 .github/scripts/provision_native_platform.py
          python3 .github/scripts/provision_cuda_build.py
      - name: Install hosted build prerequisites
        run: |
          sudo apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install -y libvulkan-dev glslc spirv-tools ninja-build zlib1g-dev libzstd-dev libxml2-dev patchelf
      - name: Configure opt-in CUDA compiler
        run: >-
          cmake -S . -B build/cuda -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DKALANDRA_LLVM_ROOT="$KALANDRA_LLVM_ROOT"
          -DKALANDRA_BUILD_VULKAN_RUNTIME=ON -DKALANDRA_BUILD_CUDA_SOURCE=ON -DKALANDRA_BUILD_CUDA_RUNTIME=ON
          -DKALANDRA_CUDA_HEADERS="$KALANDRA_CUDA_HEADERS"
          -DKALANDRA_CUDA_NVRTC="$KALANDRA_CUDA_NVRTC"
          -DKALANDRA_CUDA_CCCL_HEADERS="$KALANDRA_CUDA_CCCL_HEADERS"
          -DKALANDRA_CUDA_CRT_HEADERS="$KALANDRA_CUDA_CRT_HEADERS"
          -DKALANDRA_BUILD_METAL_RUNTIME=OFF -DKALANDRA_BUILD_METAL_PROOF=OFF
      - name: Build compiler and CPU-only contract checks
        run: >-
          cmake --build build/cuda --parallel 4 --target kalandra kalandra-test-observer
          kalandra-cuda-artifact-tests kalandra-cuda-float-tests kalandra-cuda-catalog-tests
      - name: Build standalone CUDA and multi-backend packages
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
        run: |
          cmake --build build/cuda --parallel 4 --target native-cuda-standalone-package native-gpu-standalone-package
          python3 native/gpu-bundle/qualify.py --compiler build/cuda/native-gpu-standalone/package-stage/kalandra-native-gpu-standalone/bin/kalandra --output build/gpu-bundle
          tar -C build/gpu-bundle -czf build/gpu-bundle-linux.tar.gz .
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
        with:
          name: gpu-bundle-linux
          path: build/gpu-bundle-linux.tar.gz
      - name: Compile generic algorithms and static trait dispatch
        run: >-
          python3 native/tests/GenericsSourceTests.py
          --compiler build/cuda/native/kalandra --target cuda
          --variant optimized --compile-only
          --output build/cuda-artifacts/generics
      - name: Compile mixed child-process and GPU application
        run: python3 native/tests/MixedProcessTests.py --compiler build/cuda/native/kalandra --target cuda --compile-only
      - name: Compile owned byte buffers and filesystem overloads
        run: >-
          python3 native/tests/BufferSourceTests.py
          --compiler build/cuda/native/kalandra --target cuda
          --variant optimized --compile-only
          --output build/cuda-artifacts/buffers
      - name: Compile resumable host calls and owned callback cases
        run: >-
          python3 native/tests/ResumableCallSourceTests.py
          --compiler build/cuda/native/kalandra --target cuda
          --variant optimized --compile-only
          --output build/cuda-artifacts/resumable-calls
      - name: Check PTX, provenance, private ABI and installed header ownership
        run: ctest --test-dir build/cuda -j4 -R 'native-(cuda-(artifacts|artifact-contract|upstream-audit|cutlass-audit|wrap-precision)|gpu-shared-installed-headers)$' --output-on-failure
      - name: Check source/output protection and public command options
        run: python3 native/cuda-source/qualification/command.py --compiler build/cuda/native/kalandra-test-observer
      - name: Qualify relocated package and missing-resource guards
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
        run: >-
          python3 native/cuda-source/qualification/installed.py
          --archive build/cuda/native-cuda-standalone/kalandra-native-cuda-standalone-linux-x86_64.tar.gz
          --root build/cuda-installed
      - name: Verify reproducible archive from the frozen build
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
        run: |
          cp build/cuda/native-cuda-standalone/*.tar.gz.sha256 "$RUNNER_TEMP/cuda-first.sha256"
          cmake --build build/cuda --parallel 4 --target native-cuda-standalone-package
          cmp "$RUNNER_TEMP/cuda-first.sha256" build/cuda/native-cuda-standalone/*.tar.gz.sha256
      # Hosted machines have no qualified GPU. Execute these exact downloaded
      # archives on physical hardware separately; never call a CPU substitute CUDA.
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
        with:
          name: native-cuda-package-linux-x86_64
          path: build/cuda/native-cuda-standalone/*.tar.gz*
          if-no-files-found: error
          retention-days: 7
      - name: Preserve an explicitly unqualified archive for failure diagnosis
        if: failure() && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci'))
        uses: actions/upload-artifact@v4
        with:
          name: native-cuda-unqualified-package-linux-x86_64
          path: build/cuda/native-cuda-standalone/*.tar.gz*
          if-no-files-found: ignore
          retention-days: 3
