name: Native Windows qualification
on:
  push:
    branches: ["native", "develop"]
    tags: ["v*"]
    paths:
      [
        "CMakeLists.txt",
        "VERSION",
        "native/**",
        "apps/website/src/content/native/getting-started.tiramisu",
        ".github/workflows/native-windows.yml",
      ]
  pull_request:
    paths:
      [
        "CMakeLists.txt",
        "VERSION",
        "native/**",
        ".github/workflows/native-windows.yml",
        ".github/scripts/**",
        "apps/website/src/content/native/cross-compilation.tiramisu",
        "apps/website/src/content/native/getting-started.tiramisu",
      ]
  workflow_dispatch:
defaults:
  run:
    shell: pwsh
permissions:
  contents: read
concurrency:
  group: native-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x86_64
            msvc: x64
            artifact: native-windows-assets
          - runner: windows-11-arm
            arch: arm64
            msvc: arm64
            artifact: native-windows-arm64-assets
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    outputs:
      archive-ready: ${{ steps.archive.outputs.artifact-id != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Validate tagged toolchain version and release notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python .github/scripts/release_version.py
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc }}
      - uses: actions/cache/restore@v4
        id: llvm-cache
        with:
          path: ${{ runner.temp }}/kalandra-llvm/installation
          key: native-llvm-mlir-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/toolchain-proof/toolchain.json') }}-v2
      - name: Verify Windows architecture and release gates
        run: |
          python -m unittest discover -s .github/scripts -p test_windows_arm64.py
          if ($LASTEXITCODE -ne 0) { throw "Architecture gate tests failed" }
          python -m unittest discover -s .github/scripts -p test_collect_native_platforms.py
          if ($LASTEXITCODE -ne 0) { throw "Release collector tests failed" }
          python -m unittest discover -s .github/scripts -p test_native_release_assets.py
          if ($LASTEXITCODE -ne 0) { throw "Release inventory tests failed" }
      - name: Provision verified LLVM and matching MLIR
        run: python .github/scripts/provision_native_platform.py
      - name: Save qualified SDK before compiler tests
        uses: actions/cache/save@v4
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/kalandra-llvm/installation
          key: ${{ steps.llvm-cache.outputs.cache-primary-key }}
      - name: Configure native compiler
        run: >-
          cmake -S . -B build/windows -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF -DKALANDRA_BUILD_TEST_OBSERVER=ON -DCMAKE_INSTALL_LIBDIR=lib
          -DKALANDRA_LLVM_ROOT="$env:KALANDRA_LLVM_ROOT"
          -DKALANDRA_BUILD_METAL_RUNTIME=OFF -DKALANDRA_BUILD_METAL_PROOF=OFF
      - name: Build native CPU toolchain
        run: cmake --build build/windows --target native-cpu-toolchain kalandra kalandra-task-core-optimized -j2 -- -k 0
      - name: Qualify application entries, console I/O and formatting
        run: |
          $variants = @('debug', 'optimized')
          if ('${{ matrix.arch }}' -eq 'x86_64') { $variants += 'sanitized' }
          foreach ($variant in $variants) {
            foreach ($suite in @('ApplicationSourceTests', 'ConsoleSourceTests', 'FormatSourceTests')) {
              python "native/tests/$suite.py" --compiler build/windows/native/kalandra.exe --variant $variant --output "build/windows/io/$suite-$variant"
              if ($LASTEXITCODE -ne 0) { throw "$suite $variant failed" }
            }
          }
      - name: Qualify explicit returns and primitive types
        run: |
          python native/tests/ExplicitReturnTests.py --compiler build/windows/native/kalandra-test-observer.exe --checker build/windows/native/kalandra-check.exe --output build/windows/explicit-returns
          if ($LASTEXITCODE -ne 0) { throw 'Explicit return qualification failed' }
      - name: Qualify opaque synchronous task ownership
        run: |
          & "$env:KALANDRA_LLVM_ROOT/bin/clang++.exe" -std=c++23 -O2 -fms-runtime-lib=static native/tests/ClosedTaskTests.cpp build/windows/native/kalandra-task-core-optimized.lib -o build/windows/closed-task-tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Closed task runner compilation failed' }
          & build/windows/closed-task-tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Closed task runner qualification failed' }
      - name: Qualify scoped ownership and compiler value layouts
        run: |
          foreach ($test in @('OwnershipScopeTests', 'ValueScopeTests')) {
            & "$env:KALANDRA_LLVM_ROOT/bin/clang++.exe" -std=c++23 -O2 -fms-runtime-lib=static "native/tests/$test.cpp" build/windows/native/kalandra-task-core-optimized.lib -o "build/windows/$test.exe"
            if ($LASTEXITCODE -ne 0) { throw "$test compilation failed" }
            & "build/windows/$test.exe"
            if ($LASTEXITCODE -ne 0) { throw "$test qualification failed" }
          }
          cmake "-DCOMPILER=$env:GITHUB_WORKSPACE/build/windows/native/kalandra-test-observer.exe" "-DCLANGXX=$env:KALANDRA_LLVM_ROOT/bin/clang++.exe" "-DRUNTIME=$env:GITHUB_WORKSPACE/build/windows/native/kalandra-native-runtime.lib" -DVARIANT=optimized "-DSOURCE_DIR=$env:GITHUB_WORKSPACE/native" "-DOUTPUT_DIR=$env:GITHUB_WORKSPACE/build/windows/value-scope-layout" -P native/cmake/VerifyValueScopeLayouts.cmake
          if ($LASTEXITCODE -ne 0) { throw 'Compiler value layout qualification failed' }
      - name: Verify recursive scalar values and checked state
        run: >-
          python native/tests/RecursiveScalarTests.py
          --compiler build/windows/native/kalandra-test-observer.exe
          --clang "$env:KALANDRA_LLVM_ROOT/bin/clang++.exe"
          --output build/windows/recursive-scalars
      - name: Qualify arithmetic policy, benchmark references and MIT provenance
        run: |
          python native/tests/CrossToolchainTests.py --compiler build/windows/native/kalandra-test-observer.exe
          if ($LASTEXITCODE -ne 0) { throw 'Cross-toolchain validation failed' }
          python native/tests/ArithmeticPolicyTests.py --compiler build/windows/native/kalandra-test-observer.exe --output build/windows/arithmetic-policy
          if ($LASTEXITCODE -ne 0) { throw 'Arithmetic policy qualification failed' }
          python native/tests/FairBenchmarkTests.py
          if ($LASTEXITCODE -ne 0) { throw 'Benchmark reference qualification failed' }
          python native/third_party/mlx-steel/vendor.py
          if ($LASTEXITCODE -ne 0) { throw 'MIT provenance qualification failed' }
      - name: Verify deep internal calls and physical stack safety
        run: >-
          python native/tests/CallFoundationTests.py
          --compiler build/windows/native/kalandra-test-observer.exe
          --clang "$env:KALANDRA_LLVM_ROOT/bin/clang++.exe"
          --output build/windows/call-foundation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-call-foundation-${{ matrix.arch }}
          path: build/windows/call-foundation/**
          if-no-files-found: warn
      - name: Verify ordinary scalar ABI, private buffers and failure cleanup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = 'build/windows/native/kalandra-test-observer.exe'
          $clang = "$env:KALANDRA_LLVM_ROOT/bin/clang++.exe"
          python native/tests/OrdinarySourceTests.py --compiler $compiler --clang $clang --output build/windows/ordinary-direct --direct-entry
          if ($LASTEXITCODE -ne 0) { throw 'Scalar direct ABI qualification failed' }
          python native/tests/OrdinaryLoopSourceTests.py --compiler $compiler --clang $clang --output build/windows/ordinary-loop-direct --direct-entry --exhaustive-entry
          if ($LASTEXITCODE -ne 0) { throw 'Loop direct ABI qualification failed' }
          python native/tests/OrdinarySourceTests.py --compiler $compiler --clang $clang --output build/windows/ordinary-buffer-types --direct-entry --buffer-entry
          if ($LASTEXITCODE -ne 0) { throw 'Typed buffer ABI qualification failed' }
          python native/tests/OrdinaryReductionSourceTests.py --compiler $compiler --clang $clang --output build/windows/ordinary-reductions
          if ($LASTEXITCODE -ne 0) { throw 'Reduction folding qualification failed' }
          python native/tests/OrdinaryIntegerCasesSourceTests.py --compiler $compiler --clang $clang --output build/windows/ordinary-integer-cases
          if ($LASTEXITCODE -ne 0) { throw 'Integer recurrence qualification failed' }
          python native/tests/OrdinaryArrayTests.py --compiler $compiler --clang $clang --output build/windows/ordinary-buffer-direct --direct-entry
          if ($LASTEXITCODE -ne 0) { throw 'Buffer direct ABI qualification failed' }
          python native/tests/OrdinaryDirectFaultTests.py --compiler $compiler --clang $clang --output build/windows/ordinary-direct-faults
          if ($LASTEXITCODE -ne 0) { throw 'Scalar failure qualification failed' }
          python native/tests/OrdinaryBufferFaultTests.py --compiler $compiler --clang $clang --output build/windows/ordinary-buffer-faults
          if ($LASTEXITCODE -ne 0) { throw 'Buffer failure qualification failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-ordinary-qualification-${{ matrix.arch }}
          path: build/windows/ordinary*/**/*.json
          if-no-files-found: warn
      - name: Qualify CPU tensor transforms
        run: >-
          python native/tests/TensorTransformTests.py
          --compiler build/windows/native/kalandra-test-observer.exe
          --clang "$env:KALANDRA_LLVM_ROOT/bin/clang++.exe"
          --output build/windows/tensor-transforms --quick
      - name: Verify documented PowerShell examples
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $repo = (Get-Location).Path
          $driver = Join-Path $repo 'build/windows/native/kalandra.exe'
          $document = Get-Content 'apps/website/src/content/native/getting-started.tiramisu' -Raw
          $examples = [regex]::Matches($document, 'codeblock \{ language = powershell, """([\s\S]*?)""" \}')
          $source = [regex]::Match($document, 'codeblock \{ language = kalandra, """([\s\S]*?)""" \}')
          if ($examples.Count -ne 2 -or -not $source.Success) { throw 'Documented first-program/starter examples not found' }
          $env:PATH = "$(Split-Path $driver);$env:PATH"
          for ($index = 0; $index -lt $examples.Count; $index++) {
            $example = Join-Path $env:RUNNER_TEMP "native-docs-powershell-$index"
            New-Item -ItemType Directory -Path $example -Force | Out-Null
            Push-Location $example
            try {
              if ($index -eq 0) {
                Set-Content -Path main.k -Value $source.Groups[1].Value -Encoding utf8 -NoNewline
              }
              $result = @(& ([scriptblock]::Create($examples[$index].Groups[1].Value)))
              $expected = if ($index -eq 0) { '42' } else { "2`n4`n6" }
              if ($LASTEXITCODE -ne 0 -or (($result -join "`n").Trim()) -ne $expected) {
                throw "Documented example $index returned unexpected output: $result"
              }
            } finally { Pop-Location }
          }
      - name: Record native ARM64 scalar performance smoke evidence
        if: matrix.arch == 'arm64'
        run: >-
          python native/benchmarks/WindowsArm64Smoke.py
          --compiler build/windows/native/kalandra-test-observer.exe
          --clang "$env:KALANDRA_LLVM_ROOT/bin/clang++.exe"
          --output build/windows/arm64-performance
      - uses: actions/upload-artifact@v4
        if: always() && matrix.arch == 'arm64'
        with:
          name: native-windows-arm64-performance-smoke
          path: build/windows/arm64-performance/measurement.json
          if-no-files-found: warn
      - name: Package standalone compiler
        run: cmake --build build/windows --target native-cpu-standalone-package
      - name: Independently configure the second build
        run: >-
          cmake -S . -B build/windows-repro -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF -DKALANDRA_BUILD_TEST_OBSERVER=ON -DCMAKE_INSTALL_LIBDIR=lib
          -DKALANDRA_LLVM_ROOT="$env:KALANDRA_LLVM_ROOT"
          -DKALANDRA_BUILD_METAL_RUNTIME=OFF -DKALANDRA_BUILD_METAL_PROOF=OFF
      - name: Independently rebuild and compare the distribution
        run: |
          cmake --build build/windows-repro --target native-cpu-standalone-package -j2
          python native/packaging/CompareDistributions.py build/windows build/windows-repro --platform windows-${{ matrix.arch }} --kind cpu
      - uses: actions/upload-artifact@v4
        id: archive
        if: ${{ always() && hashFiles('build/windows/native-cpu-standalone/*.tar.gz') != '' }}
        with:
          name: ${{ matrix.artifact }}
          path: build/windows/native-cpu-standalone/*.tar.gz*
          if-no-files-found: error
  downloaded-package:
    needs: cpu
    if: ${{ always() && needs.cpu.outputs.archive-ready == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x86_64
            msvc: x64
            artifact: native-windows-assets
          - runner: windows-11-arm
            arch: arm64
            msvc: arm64
            artifact: native-windows-arm64-assets
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: downloaded
      - name: Qualify downloaded compiler without installing LLVM
        run: python native/packaging/PortablePackageTests.py downloaded/kalandra-native-cpu-standalone-windows-${{ matrix.arch }}.tar.gz
  editor-arm64:
    needs: [cpu, downloaded-package]
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/download-artifact@v4
        with:
          name: native-windows-arm64-assets
          path: downloaded
      - name: Qualify the installed VSIX in native ARM64 VS Code
        run: python .github/scripts/qualify_windows_arm64_editor.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-windows-arm64-editor-qualification
          path: |
            build/native/editor/**/result.json
            build/native/editor/qualification.json
          if-no-files-found: warn
