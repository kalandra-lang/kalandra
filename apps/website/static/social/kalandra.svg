<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
<title id="title">Kalandra — One language. CPU and GPU.</title>
<desc id="description">Native CPU and GPU programming. White Swiss typography on near-black with vermilion accents and a CPU coordination stem connected to parallel GPU tensor cells.</desc>
<rect width="1200" height="630" fill="#080808"/>
<g fill="#f6f6f6">
<path transform="translate(54 49) scale(.4)" d="M6 8h80v14H55L26 51H6V37h14l15-15H6Z"/>
<g font-family="Geist, sans-serif">
<text x="105" y="76" font-size="32" font-weight="800" letter-spacing="-.8">Kalandra</text>
<text x="1144" y="73" font-size="20" fill="#b5b5b5" text-anchor="end">kalandra.dev</text>
<path d="M56 104H1144" stroke="#444444"/>
<text x="50" y="232" font-size="140" font-weight="800" letter-spacing="-5">One language.</text>
<text x="50" y="354" font-size="146" font-weight="800" letter-spacing="-5">CPU and GPU.</text>
<text x="56" y="403" font-size="24" fill="#b5b5b5">Typed functions. Structured parallelism. Native execution.</text>
</g>
